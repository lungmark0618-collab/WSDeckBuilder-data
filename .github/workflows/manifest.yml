name: 產生 manifest 並健檢

# manifest.json 是 cards/ 的衍生產物。人工維護遲早會漏——改完卡表忘了重跑
# make_manifest.py，manifest 寫的版本就跟實際檔案對不上，手機那邊會抓到舊的或抓不到。
on:
  push:
    branches: [main]
    paths:
      - "cards/*_cards.json"
      - "tools/make_manifest.py"
      - "tools/check_cards.py"
      - "tools/make_translation_announcements.py"
      - "tools/test_translation_announcements.py"
      - ".github/workflows/manifest.yml"
  workflow_dispatch:

permissions:
  contents: write      # 產生後要 commit 回來

concurrency:
  group: publish-card-data
  cancel-in-progress: false

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 卡表健檢
        run: python3 tools/check_cards.py --resources cards --manifest manifest.json

      - name: 產生 manifest
        run: |
          # App 顯示的更新說明就用這次的 commit 標題，你寫什麼手機上就看到什麼
          NOTES="$(git log -1 --pretty=%s)"
          python3 tools/make_manifest.py \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/cards/" \
            --resources cards \
            --notes "$NOTES" \
            --out manifest.json

      - name: 確認產出的 manifest 沒問題
        run: python3 tools/check_cards.py --resources cards --manifest manifest.json

      - name: 產生新系列公告
        run: |
          python3 -m unittest discover -s tools -p 'test_translation_announcements.py'
          python3 tools/make_translation_announcements.py

      - name: Commit 回 repo
        run: |
          if git diff --quiet -- manifest.json announcements.json announcement_series.json; then
            echo "manifest 沒有變動，不需要 commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json announcements.json announcement_series.json
          git commit -m "Regenerate manifest [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
